<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rezaldy Rafi — low-code analyst and full-stack developer building secure enterprise systems across ServiceNow, Pega, OutSystems, and the web."
    />
    <meta name="author" content="Rezaldy Rafi" />
    <meta name="theme-color" content="#080a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Rezaldy Rafi — Low-Code & Enterprise Systems"
    />
    <meta
      property="og:description"
      content="Enterprise systems, made human. Low-code delivery across ServiceNow, Pega, and OutSystems, plus full-stack web engineering."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rezaldy Rafi — Low-code. High impact."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Rezaldy Rafi — Low-Code & Enterprise Systems</title>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rr-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "dark" ? "#080a08" : "#f4f2e9",
            );
          }
        } catch (error) {
          /* Default to the dark theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
